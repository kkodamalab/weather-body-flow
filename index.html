<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather / Body Flow — Particle</title><link rel="stylesheet" href="src/styles/main.css"></head><body><canvas id="flow-canvas" aria-label="3D optic flow"></canvas><header class="topbar"><strong>WEATHER / BODY FLOW</strong><span class="badge">PARTICLE · STEP 1</span><span id="fps">-- FPS</span><button id="hide-ui">HIDE UI</button><button id="fullscreen">FULLSCREEN</button></header><aside id="controls"><h1>ART CONTROL</h1><p class="hint">3D OPTIC FLOW · perspective projection</p><section><h2>PARTICLES</h2><label>Particle Count <output for="count"></output><input id="count" type="range" min="500" max="8000" step="100" value="1100"></label><label>Particle Size (diameter px) <output for="size"></output><input id="size" type="range" min="0.5" max="5" step="0.1" value="4"></label><label>Particle Color <input id="color" type="color" value="#c3d4de"></label><label>Opacity <output for="opacity"></output><input id="opacity" type="range" min="0.05" max="1" step="0.05" value="0.65"></label><label>Blur / Glow <output for="glow"></output><input id="glow" type="range" min="0" max="20" step="1" value="0"></label></section><section><h2>SPACE</h2><label>Background <input id="background" type="color" value="#000000"></label><label>Depth Near <output for="near"></output><input id="near" type="range" min="0.5" max="8" step="0.5" value="1"></label><label>Depth Far <output for="far"></output><input id="far" type="range" min="10" max="60" step="1" value="20"></label><label>FOV <output for="fov"></output><input id="fov" type="range" min="45" max="120" step="1" value="90"></label><label>FOE X <output for="foeX"></output><input id="foeX" type="range" min="0.2" max="0.8" step="0.01" value="0.5"></label><label>FOE Y <output for="foeY"></output><input id="foeY" type="range" min="0.2" max="0.8" step="0.01" value="0.5"></label></section><section class="actions"><button id="reset">RESET VIEW</button><button id="pause">PAUSE</button></section><p class="hint">Drag: rotate · right drag: pan · wheel: move</p><p id="display-status" role="status"></p></aside><aside id="tracking-panel"><h2>TRACKING / WEATHER</h2><button id="camera-start">CAMERA ON</button><button id="camera-toggle">CAMERA OFF</button><label><input id="mirror" type="checkbox" checked> Mirror preview</label><button id="camera-preview-toggle">HIDE CAMERA PREVIEW</button><button id="skeleton-toggle">SKELETON OFF</button><button id="calibrate">CALIBRATE</button><label>Body Influence <input id="body-influence" type="range" min="0" max="2" step=".05" value=".35"></label><label>Body Smoothing <input id="body-smoothing" type="range" min="0" max=".98" step=".01" value=".82"></label><label>Body Response <input id="body-response" type="range" min="0" max="3" step=".05" value="1"></label><label>Left Hand Influence <input id="left-influence" type="range" min="0" max="2" step=".05" value=".55"></label><label>Right Hand Influence <input id="right-influence" type="range" min="0" max="2" step=".05" value=".55"></label><label>Hand Radius <input id="hand-radius" type="range" min=".5" max="8" step=".1" value="2.5"></label><label>Viscosity <input id="viscosity" type="range" min="0" max="1" step=".01" value="0"></label><label>Vortex Strength <input id="vortex-strength" type="range" min="0" max="2" step=".05" value=".25"></label><label>Flow Persistence <input id="flow-persistence" type="range" min="0" max="1" step=".01" value=".3"></label><label>Wind Mode <select id="wind-mode"><option>OFF</option><option>MANUAL</option><option>AUTO WEATHER</option></select></label><label>Wind Direction <input id="wind-direction" type="range" min="0" max="359" value="0"></label><label>Wind Speed <input id="wind-speed" type="range" min="0" max="20" step=".1" value="0"></label><button id="debug-toggle">DEBUG ON</button><pre id="debug-overlay"></pre></aside><video id="camera-preview" autoplay playsinline muted></video><canvas id="skeleton-canvas"></canvas><script type="module" src="src/main.js"></script></body></html>
