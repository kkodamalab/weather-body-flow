<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather / Body Flow — Particle</title><link rel="stylesheet" href="src/styles/main.css"></head><body><canvas id="flow-canvas" aria-label="3D optic flow"></canvas><header class="topbar"><strong>WEATHER / BODY FLOW</strong><span class="badge">PARTICLE · STEP 1</span><span id="fps">-- FPS</span><button id="hide-ui">HIDE UI</button><button id="fullscreen">FULLSCREEN</button></header><aside id="controls"><h1>ART CONTROL</h1><p class="hint">3D OPTIC FLOW · perspective projection</p><section><h2>PARTICLES</h2><label>Particle Count <output for="count"></output><input id="count" type="range" min="500" max="8000" step="250" value="3500"></label><label>Particle Size <output for="size"></output><input id="size" type="range" min="0.5" max="5" step="0.1" value="1.5"></label><label>Particle Color <input id="color" type="color" value="#b9f9ff"></label><label>Opacity <output for="opacity"></output><input id="opacity" type="range" min="0.05" max="1" step="0.05" value="0.65"></label><label>Blur / Glow <output for="glow"></output><input id="glow" type="range" min="0" max="20" step="1" value="0"></label></section><section><h2>SPACE</h2><label>Background <input id="background" type="color" value="#000000"></label><label>Depth Near <output for="near"></output><input id="near" type="range" min="0.5" max="8" step="0.5" value="1"></label><label>Depth Far <output for="far"></output><input id="far" type="range" min="10" max="60" step="1" value="32"></label><label>FOV <output for="fov"></output><input id="fov" type="range" min="45" max="120" step="1" value="92"></label><label>FOE X <output for="foeX"></output><input id="foeX" type="range" min="0.2" max="0.8" step="0.01" value="0.5"></label><label>FOE Y <output for="foeY"></output><input id="foeY" type="range" min="0.2" max="0.8" step="0.01" value="0.5"></label></section><section class="actions"><button id="reset">RESET VIEW</button><button id="pause">PAUSE</button></section><p class="hint">Drag: rotate · right drag: pan · wheel: move</p></aside><script type="module" src="src/main.js"></script></body></html>
