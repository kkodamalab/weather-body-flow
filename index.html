<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather / Body Flow</title><link rel="stylesheet" href="./css/style.css"></head><body>
<canvas id="stage"></canvas><div id="cameraBox"><video id="camera" autoplay playsinline muted></video><canvas id="cameraDebug"></canvas></div><canvas id="debug"></canvas>
<div class="top"><strong>WEATHER / BODY FLOW</strong><span id="status">準備中</span><button id="particle">PARTICLE</button><button id="stream">STREAMLINE</button><button id="skeleton">SKELETON OFF</button><button id="hide">HIDE UI</button><button id="full">FULLSCREEN</button></div>
<aside id="panel"><h2>ART CONTROL</h2><section><label>Particle Count <output id="particleCountOut"></output><input id="particleCount" type="range" min="500" max="8000" step="250" value="3500"></label><label>Particle Size <output id="particleSizeOut"></output><input id="particleSize" type="range" min="1" max="6" step=".2" value="2"></label><label>Line Density <output id="lineDensityOut"></output><input id="lineDensity" type="range" min="30" max="400" value="140"></label><label>Trail Length <output id="trailLengthOut"></output><input id="trailLength" type="range" min="8" max="80" value="32"></label></section>
<h3>BODY FLOW</h3><section><label>Body Global <output id="bodyStrengthOut"></output><input id="bodyStrength" type="range" min="0" max="3" step=".05" value="1"></label><label>Left Hand <output id="leftStrengthOut"></output><input id="leftStrength" type="range" min="0" max="4" step=".05" value="1.4"></label><label>Right Hand <output id="rightStrengthOut"></output><input id="rightStrength" type="range" min="0" max="4" step=".05" value="1.4"></label></section>
<h3>DEBUG / TEST MODE</h3><section class="toggles"><label><input id="sourceEnvironment" type="checkbox" checked> ENVIRONMENT WIND</label><label><input id="sourceBody" type="checkbox" checked> BODY GLOBAL</label><label><input id="sourceLeft" type="checkbox" checked> LEFT HAND</label><label><input id="sourceRight" type="checkbox" checked> RIGHT HAND</label><label><input id="sourceNoise" type="checkbox" checked> NOISE</label><button id="bodyTest">BODY TEST</button><button id="leftTest">LEFT HAND TEST</button><button id="rightTest">RIGHT HAND TEST</button></section><pre id="poseStatus">MEDIAPIPE: LOADING</pre>
<h3>ENVIRONMENT</h3><section><label>Weather <select id="weatherMode"><option value="manual">MANUAL</option><option value="auto">AUTO (Open-Meteo)</option></select></label><label>Wind direction <output id="windDirectionOut"></output><input id="windDirection" type="range" min="0" max="360" value="35"></label><label>Wind speed <output id="windSpeedOut"></output><input id="windSpeed" type="range" min="0" max="30" step=".2" value="5"></label><label>Humidity <output id="humidityOut"></output><input id="humidity" type="range" min="0" max="100" value="47"></label><label>Transition sec <output id="transitionOut"></output><input id="transition" type="range" min="1" max="30" value="8"></label></section>
<h3>VIRTUAL MEDIUM</h3><section><label>Medium <select id="mediumMode"><option value="auto">AUTO WEATHER</option><option value="manual">MANUAL</option></select></label><label>Air ← viscosity → Water <output id="viscosityOut"></output><input id="viscosity" type="range" min="0" max="1" step=".01" value=".5"></label></section>
<h3>NOISE / SPACE</h3><section><label>Noise amount <output id="noiseAmountOut"></output><input id="noiseAmount" type="range" min="0" max="2" step=".02" value=".3"></label><label>Noise scale <output id="noiseScaleOut"></output><input id="noiseScale" type="range" min=".1" max="3" step=".05" value=".7"></label><label>Noise speed <output id="noiseSpeedOut"></output><input id="noiseSpeed" type="range" min="0" max="2" step=".05" value=".35"></label><label>Camera distance <output id="cameraDistanceOut"></output><input id="cameraDistance" type="range" min="5" max="22" step=".1" value="11"></label></section>
<label class="check"><input id="debugToggle" type="checkbox"> Debug skeleton / vectors</label><p id="fps">0 FPS</p><p class="note">Humidity maps to an artistic virtual medium — not physical air viscosity.</p></aside>
<script type="module" src="./js/app.js"></script></body></html>
